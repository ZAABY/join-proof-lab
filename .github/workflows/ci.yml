name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.8
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src tests study
      - run: uv run --frozen ruff format --check src tests study
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python study/cancellation.py > /tmp/cancellation.json
      - run: uv run --frozen python study/report.py --check
      - run: uv build
